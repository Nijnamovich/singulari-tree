syntax = "proto3";

package singularitree.v1;

option go_package = "github.com/SingulariTree/go-core/gen/go/singularitree/v1;singularitreev1";

// AppError envelope — code maps to domain error constants (domain-model.md §5, ipc-strategy.md §3)
message AppError {
  string code = 1;
  string message = 2;
  map<string, string> details = 3;
}

// Canonical error codes (enum for documentation; wire uses AppError.code string)
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  REPO_NOT_FOUND = 1;
  NOT_A_GIT_REPO = 2;
  COMMIT_NOT_FOUND = 3;
  INVALID_OID = 4;
  BRANCH_NOT_FOUND = 5;
  BRANCH_EXISTS = 6;
  DETACHED_HEAD = 7;
  IPC_UNAVAILABLE = 8;
  GO_CORE_UNAVAILABLE = 9;
  QUEUE_FULL = 10;
  STAGE_FAILED = 11;
  COMMIT_FAILED = 12;
  CHECKOUT_FAILED = 13;
  FETCH_FAILED = 14;
  PUSH_FAILED = 15;
  DIFF_FAILED = 16;
  WATCH_FAILED = 17;
  UNAUTHENTICATED = 18;
  // ===== Additive: GitHub CLI (gh) token source + GitHub REST =====
  GH_CLI_NOT_FOUND = 19;
  GH_CLI_UNAUTHENTICATED = 20;
  GITHUB_RATE_LIMITED = 21;
  GITHUB_API_ERROR = 22;
  GITHUB_TOKEN_INVALID = 23;
  // Additive: remote operations (Fetch/Push/Pull) carry a distinct pull code.
  PULL_FAILED = 24;
  // Additive: stash push (save changes before switching branch).
  STASH_FAILED = 25;
  // Additive: reset soft/mixed/hard (ADR-0021; next free number after 25).
  RESET_FAILED = 26;
  // Additive: file/hunk discard (ADR-0020). The ADR left the code at decision
  // level; the next free number (27) is used.
  DISCARD_FAILED = 27;
  // Additive: advanced-git mutations (ADR-028), next free numbers after 27.
  MERGE_CONFLICT = 28;
  MERGE_FAILED = 29;
  TAG_EXISTS = 30;
  TAG_NOT_FOUND = 31;
  // Additive: git-flow presets (ADR-027), next free number after 31.
  GIT_FLOW_FAILED = 32;
  // Additive: repository relocation (P4.1 polish — a registered folder that was
  // moved/renamed). The recorded fs path is gone, and a target path is already
  // tracked by another repository. Next free numbers after 32.
  REPO_PATH_MISSING = 33;
  REPO_PATH_IN_USE = 34;
  // Additive: cherry-pick / revert (ADR-0042), next free numbers after 34.
  // CONFLICT -> FailedPrecondition (the tree is left conflicted, as MERGE_CONFLICT);
  // FAILED -> Aborted (the operation did not change the tree).
  CHERRY_PICK_CONFLICT = 35;
  CHERRY_PICK_FAILED = 36;
  REVERT_CONFLICT = 37;
  REVERT_FAILED = 38;
}
